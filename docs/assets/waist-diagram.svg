<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 430" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <!-- 腰圍量測位置示意：肋骨下緣與骨盆上緣的中間點，皮尺水平 -->
  <rect width="545" height="430" fill="#FFFFFF"/>

  <!-- 軀幹輪廓（正面示意） -->
  <path d="M 110 52
           Q 170 30 230 52
           L 232 84
           Q 246 96 250 118
           L 252 150
           Q 254 185 244 214
           Q 238 232 240 252
           Q 244 282 256 306
           L 260 330
           Q 262 360 254 396
           L 208 396 L 206 344 L 190 320 L 174 344 L 172 396
           L 86 396
           Q 78 360 80 330
           L 84 306
           Q 96 282 100 252
           Q 102 232 96 214
           Q 86 185 88 150
           L 90 118
           Q 94 96 108 84
           Z"
        fill="#F6F4EC" stroke="#21281F" stroke-width="3" stroke-linejoin="round"/>

  <!-- 肚臍 -->
  <circle cx="170" cy="238" r="4" fill="none" stroke="#66705F" stroke-width="2.5"/>

  <!-- ① 肋骨下緣（虛線） -->
  <path d="M 96 186 Q 170 206 244 186" fill="none" stroke="#3563C9" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="300" cy="176" r="13" fill="#3563C9"/>
  <text x="300" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="322" y="181" font-size="16" font-weight="700" fill="#21281F">肋骨下緣</text>
  <line x1="248" y1="188" x2="285" y2="178" stroke="#3563C9" stroke-width="2"/>

  <!-- ② 骨盆上緣（虛線） -->
  <path d="M 98 290 Q 170 274 242 290" fill="none" stroke="#C2620A" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="300" cy="296" r="13" fill="#C2620A"/>
  <text x="300" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="322" y="301" font-size="16" font-weight="700" fill="#21281F">骨盆上緣</text>
  <line x1="246" y1="288" x2="285" y2="294" stroke="#C2620A" stroke-width="2"/>

  <!-- ③ 中間點皮尺（實心帶，保持水平） -->
  <g>
    <path d="M 92 228 L 248 228 L 248 250 L 92 250 Z" fill="#0A8A4D" opacity="0.92"/>
    <path d="M 92 228 L 248 228" stroke="#065C33" stroke-width="2"/>
    <path d="M 92 250 L 248 250" stroke="#065C33" stroke-width="2"/>
    <!-- 皮尺刻度 -->
    <g stroke="#FFFFFF" stroke-width="1.6">
      <line x1="108" y1="228" x2="108" y2="236"/><line x1="124" y1="228" x2="124" y2="240"/>
      <line x1="140" y1="228" x2="140" y2="236"/><line x1="156" y1="228" x2="156" y2="240"/>
      <line x1="172" y1="228" x2="172" y2="236"/><line x1="188" y1="228" x2="188" y2="240"/>
      <line x1="204" y1="228" x2="204" y2="236"/><line x1="220" y1="228" x2="220" y2="240"/>
      <line x1="236" y1="228" x2="236" y2="236"/>
    </g>
  </g>
  <circle cx="300" cy="239" r="13" fill="#0A8A4D"/>
  <text x="300" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="322" y="234" font-size="16" font-weight="700" fill="#21281F">兩線的中間點</text>
  <text x="322" y="254" font-size="13" fill="#66705F">約與肚臍同高，皮尺保持水平</text>
  <line x1="252" y1="239" x2="285" y2="239" stroke="#0A8A4D" stroke-width="2"/>

  <!-- 底部說明 -->
  <text x="230" y="418" text-anchor="middle" font-size="14" fill="#66705F">正常吐氣結束時讀值｜皮尺貼皮膚、不勒緊</text>
</svg>
